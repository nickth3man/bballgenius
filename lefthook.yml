pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,json}'
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    guard-only:
      glob: '*.{ts,tsx}'
      run: |
        if rg -n '\.(only|skip)\(' packages >/dev/null 2>&1; then
          echo '::warning::Focused tests (.only/.skip) found — remove before committing'
          rg -n '\.(only|skip)\(' packages
          exit 1
        fi

pre-push:
  commands:
    biome:
      glob: '*.{ts,tsx,js,jsx,json,jsonc}'
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
    typecheck:
      run: bun run typecheck
    typecheck-scripts:
      run: bun run typecheck:scripts
    typecheck-web:
      run: bunx tsc --noEmit -p packages/web/tsconfig.json
    test-unit:
      run: bun run test:unit
