# CI for BBallGenius
# Pattern: oven-sh/setup-bun@v2 + bun install (https://bun.sh/docs/guides/runtime/cicd)
# Unit tests run on every push/PR without the ~1.5 GB DuckDB file.
# Full integration tests are optional (workflow_dispatch) when data/nba.duckdb is available.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run full test suite (requires data/nba.duckdb in workspace)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run formatter and parser tests
        run: bun run test:unit --concurrency=1

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript compile check
        run: bunx tsc --noEmit

  integration:
    name: Integration tests (DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit, typecheck]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_integration == true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify database file exists
        run: |
          if [ ! -f data/nba.duckdb ]; then
            echo "::error::data/nba.duckdb is missing. Build or copy the NBA DuckDB file locally before enabling integration CI."
            echo "See README.md — Database setup."
            exit 1
          fi

      - name: Run full test suite
        run: bun test src/tests --concurrency=1

      - name: Run regression snapshot suite
        run: bun run test:regression
