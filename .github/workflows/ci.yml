# CI for BBallGenius
# Pattern: oven-sh/setup-bun@v2 + bun install (https://bun.sh/docs/guides/runtime/cicd)
# Every push/PR: guards, lint, format check, typecheck, unit + regression + integration (CI fixture), audit (moderate+).
# Full-database integration: manual workflow_dispatch when data/nba.duckdb is on the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_database:
        description: Run tests against full data/nba.duckdb (self-hosted / local copy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: CI guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Block focused/skipped tests and snapshot updates in CI
        run: bash scripts/ci-guards.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed sources are Biome-formatted
        run: bun run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript compile check
        run: bun run typecheck

  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run formatter and parser tests
        run: bun run test:unit

  regression:
    name: Regression tests (CI fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CI fixture exists
        run: test -f data/fixtures/nba.ci.duckdb

      - name: Run regression and snapshot suite
        env:
          NBA_DUCKDB_PATH: data/fixtures/nba.ci.duckdb
        run: bun run test:regression

  integration:
    name: Integration tests (CI fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CI fixture exists
        run: test -f data/fixtures/nba.ci.duckdb

      - name: Run full test suite against CI fixture
        env:
          NBA_DUCKDB_PATH: data/fixtures/nba.ci.duckdb
        run: bun test src/hub/tests --concurrency=1

  chatbot:
    name: Chatbot tests (CI fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CI fixture exists
        run: test -f data/fixtures/nba.ci.duckdb

      - name: Strict chatbot typecheck
        run: bun run typecheck:chatbot

      - name: Run chatbot test suite
        env:
          NBA_DUCKDB_PATH: data/fixtures/nba.ci.duckdb
        run: bun test src/chatbot/__tests__ --concurrency=1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [guards, lint, format, typecheck, unit, regression, integration, chatbot, audit]
    if: always()
    steps:
      - name: Require all PR checks
        env:
          GUARDS: ${{ needs.guards.result }}
          LINT: ${{ needs.lint.result }}
          FORMAT: ${{ needs.format.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          REGRESSION: ${{ needs.regression.result }}
          INTEGRATION: ${{ needs.integration.result }}
          CHATBOT: ${{ needs.chatbot.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          for name in GUARDS LINT FORMAT TYPECHECK UNIT REGRESSION INTEGRATION CHATBOT AUDIT; do
            result="${!name}"
            if [ "$result" != "success" ]; then
              echo "::error::$name finished with: $result"
              exit 1
            fi
          done

  integration-full:
    name: Integration tests (full database)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ci-success]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_full_database == true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify database file exists
        run: |
          if [ ! -f data/nba.duckdb ]; then
            echo "::error::data/nba.duckdb is missing. Build or copy the NBA DuckDB file locally before enabling full-database CI."
            echo "See README.md — Database setup."
            exit 1
          fi

      - name: Run full test suite
        run: bun test src/hub/tests --concurrency=1
