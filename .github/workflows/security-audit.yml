name: Daily Security Audit

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency audit
        id: audit
        run: |
          if bun audit --audit-level=moderate 2>&1 | tee audit-output.txt; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if vulnerabilities found
        if: steps.audit.outputs.status == 'vulnerable'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const title = `Security audit: vulnerabilities detected (${new Date().toISOString().split('T')[0]})`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
            });

            const alreadyOpen = existing.data.some(i => i.title.startsWith('Security audit:'));
            if (alreadyOpen) {
              core.info('Open security audit issue already exists, skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Dependency Audit Results\n\n\`\`\`\n${output.slice(0, 6000)}\n\`\`\`\n\nRun \`bun audit\` locally for full details.`,
              labels: ['security', 'dependencies'],
            });
