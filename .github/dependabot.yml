version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      langchain:
        patterns:
          - "@langchain/*"
          - "langchain"
      duckdb:
        patterns:
          - "@duckdb/*"
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "lefthook"
          - "typescript"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
